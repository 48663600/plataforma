# Desarrollo local con backend + frontend.
# Antes de levantarlo: cp backend/.env.example backend/.env  (y completa JWT_SECRET)
services:
  backend:
    build: ./backend
    ports: ["3000:3000"]
    env_file: ./backend/.env
    volumes:
      - ./backend/data:/app/data

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      - VITE_API_URL=http://localhost:3000
    volumes:
      - ./frontend/src:/app/src
    depends_on: [backend]
